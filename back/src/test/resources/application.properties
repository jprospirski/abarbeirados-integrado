# Configuracao valida so no teste — este arquivo sombreia o de src/main/resources
# quando o classpath e o de teste, entao ele precisa ser completo, e nao um
# complemento daquele.
#
# O teste de contexto sobe a aplicacao inteira, incluindo o DataSource. Apontar
# para o PostgreSQL faria `./mvnw test` depender de ter o banco no ar, e o build
# quebraria na maquina de quem ainda nao subiu o container. Com o H2 em memoria o
# teste roda em qualquer lugar, sem servico externo.
spring.application.name=abarbeirados

spring.datasource.url=jdbc:h2:mem:abarbeirados-teste;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop e nao update: cada execucao comeca do zero, sem herdar tabela de
# uma rodada anterior.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# O mesmo data.sql do main roda aqui, entao o teste ve o catalogo real.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
