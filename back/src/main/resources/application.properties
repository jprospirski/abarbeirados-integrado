spring.application.name=abarbeirados

# PostgreSQL 18. Os valores depois dos dois-pontos sao o padrao e batem com o
# docker-compose.yml da raiz, entao numa maquina limpa nao ha nada a configurar.
# Quem rodar o banco em outra porta, base ou senha exporta a variavel de ambiente
# e nao precisa editar (nem arriscar commitar) este arquivo.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:abarbeirados}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Driver e dialeto saem da URL. Declarar os dois a mao cria uma segunda fonte de
# verdade que desencontra da dependencia do pom no dia em que uma das duas mudar.

spring.jpa.hibernate.ddl-auto=update
# Desligado de proposito: com ele ligado o Hibernate mantem a sessao aberta ate a
# renderizacao da resposta, o que esconde erro de lazy loading em desenvolvimento.
spring.jpa.open-in-view=false

# Catalogo de servicos (data.sql), sem o qual a tela de agendamento abre vazia.
# `always` porque o padrao so roda o script em banco embarcado, e `defer` para o
# Hibernate criar as tabelas antes do INSERT — na ordem natural o script roda
# primeiro e quebra em tabela inexistente.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
